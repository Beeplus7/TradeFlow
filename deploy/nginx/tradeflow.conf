# TradFlow ONLY — do not merge into reelstorm or other project sites.
# Domain: f.reelstorm.uk
# Upstream ports: web 3030 · api 4100 (localhost only)
# TLS: HTTP proxy until certbot; certbot --nginx will add 443.

upstream tradeflow_web {
  server 127.0.0.1:3030;
  keepalive 8;
}

upstream tradeflow_api {
  server 127.0.0.1:4100;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name f.reelstorm.uk;

  client_max_body_size 25m;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location /api/ {
    proxy_pass http://tradeflow_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://tradeflow_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
