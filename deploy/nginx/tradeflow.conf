# TradFlow ONLY — do not merge into reelstorm or other project sites.
# Domain: tradflow.online
# Upstream ports: web 3030 · api 4100 (localhost only)

upstream tradeflow_web {
  server 127.0.0.1:3030;
  keepalive 8;
}

upstream tradeflow_api {
  server 127.0.0.1:4100;
  keepalive 8;
}

server {
  server_name tradflow.online www.tradflow.online;

  client_max_body_size 25m;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location /api/ {
    proxy_pass http://tradeflow_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://tradeflow_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tradflow.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tradflow.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = tradflow.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  listen [::]:80;
  server_name tradflow.online www.tradflow.online;
    return 404; # managed by Certbot


}